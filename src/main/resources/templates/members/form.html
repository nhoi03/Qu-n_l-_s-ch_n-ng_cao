<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit} ? 'Chỉnh Sửa Thành Viên' : 'Thêm Thành Viên Mới')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('members')}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container main-container" style="max-width: 700px;">
    <div class="card">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0 text-primary">
                <i th:class="${isEdit} ? 'bi bi-person-gear me-2' : 'bi bi-person-plus me-2'"></i>
                <span th:text="${isEdit} ? 'Chỉnh Sửa Thành Viên' : 'Thêm Thành Viên Mới'"></span>
            </h5>
        </div>
        <div class="card-body p-4">
            <form th:action="${isEdit} ? @{/members/{id}(id=${memberId})} : @{/members}"
                  th:object="${memberForm}"
                  method="post">

                <div class="mb-3">
                    <label for="fullName" class="form-label fw-semibold">Họ và Tên <span class="text-danger">*</span></label>
                    <input type="text"
                           id="fullName"
                           th:field="*{fullName}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                           placeholder="VD: Nguyễn Văn A">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Địa Chỉ Email <span class="text-danger">*</span></label>
                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                           placeholder="VD: nguyenvana@gmail.com">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label fw-semibold">Số Điện Thoại</label>
                    <input type="text"
                           id="phone"
                           th:field="*{phone}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                           placeholder="VD: 0901234567">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>

                <div class="mb-4">
                    <label for="status" class="form-label fw-semibold">Trạng Thái Tài Khoản <span class="text-danger">*</span></label>
                    <select id="status" th:field="*{status}" class="form-select">
                        <option th:each="st : ${statuses}"
                                th:value="${st}"
                                th:text="${st.name() == 'ACTIVE' ? 'Đang hoạt động (ACTIVE)' : 'Đang bị khóa (BLOCKED)'}">
                        </option>
                    </select>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/members}" class="btn btn-outline-secondary">Hủy bỏ</a>
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-save me-1"></i> Lưu thông tin
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
