<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Quản Lý Thư Viện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-container {
            flex: 1;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .card {
            border-radius: 0.5rem;
            border: 1px solid rgba(0,0,0,0.08);
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .badge-status-active {
            background-color: #198754;
        }
        .badge-status-blocked, .badge-status-deleted {
            background-color: #dc3545;
        }
        .badge-status-inactive {
            background-color: #6c757d;
        }
        .table th {
            font-weight: 600;
            background-color: #f1f3f5;
        }
    </style>
</head>
<body>

<nav th:fragment="navbar(activeTab)" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/reports}">
            <i class="bi bi-book-half me-2"></i>Thư Viện
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-prev-icon"></span>
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'reports' ? 'active fw-bold' : ''}" th:href="@{/reports}">
                        <i class="bi bi-speedometer2 me-1"></i>Tổng Quan
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'books' ? 'active fw-bold' : ''}" th:href="@{/books}">
                        <i class="bi bi-journal-bookmark me-1"></i>Sách
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'categories' ? 'active fw-bold' : ''}" th:href="@{/categories}">
                        <i class="bi bi-tags me-1"></i>Thể Loại
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'members' ? 'active fw-bold' : ''}" th:href="@{/members}">
                        <i class="bi bi-people me-1"></i>Thành Viên
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeTab == 'borrowings' ? 'active fw-bold' : ''}" th:href="@{/borrowings}">
                        <i class="bi bi-arrow-left-right me-1"></i>Phiếu Mượn
                    </a>
                </li>
            </ul>
            <div class="d-flex">
                <a th:href="@{/borrowings/new}" class="btn btn-warning btn-sm fw-bold">
                    <i class="bi bi-plus-circle me-1"></i>Tạo Phiếu Mượn
                </a>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="alerts" class="container">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<footer th:fragment="footer" class="bg-light text-muted text-center py-3 mt-auto border-top">
    <div class="container">
        <small>© 2026 Hệ Thống Quản Lý Thư Viện - Spring Boot & Thymeleaf</small>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
