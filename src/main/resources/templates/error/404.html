<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Không Tìm Thấy Tài Nguyên (404)')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('')}"></nav>

<div class="container main-container d-flex align-items-center justify-content-center py-5">
    <div class="text-center" style="max-width: 600px;">
        <div class="display-1 fw-bold text-danger mb-3">404</div>
        <h3 class="fw-bold mb-3">Không Tìm Thấy Trang Hoặc Tài Nguyên</h3>
        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'Tài nguyên bạn yêu cầu không tồn tại hoặc đã bị xóa.'}"></p>
        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/reports}" class="btn btn-primary px-4">
                <i class="bi bi-house-door me-1"></i> Về Trang Chủ
            </a>
            <a th:href="@{/books}" class="btn btn-outline-secondary px-4">
                <i class="bi bi-journal-bookmark me-1"></i> Danh Sách Sách
            </a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
