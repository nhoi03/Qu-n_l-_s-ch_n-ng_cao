<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit} ? 'Chỉnh Sửa Thể Loại' : 'Thêm Thể Loại Mới')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('categories')}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container main-container" style="max-width: 700px;">
    <div class="card">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0 text-primary">
                <i th:class="${isEdit} ? 'bi bi-pencil-square me-2' : 'bi bi-plus-circle me-2'"></i>
                <span th:text="${isEdit} ? 'Chỉnh Sửa Thể Loại' : 'Thêm Thể Loại Mới'"></span>
            </h5>
        </div>
        <div class="card-body p-4">
            <form th:action="${isEdit} ? @{/categories/{id}(id=${categoryId})} : @{/categories}"
                  th:object="${categoryForm}"
                  method="post">

                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Tên Thể Loại <span class="text-danger">*</span></label>
                    <input type="text"
                           id="name"
                           th:field="*{name}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                           placeholder="Ví dụ: Công nghệ thông tin">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label fw-semibold">Mô Tả</label>
                    <textarea id="description"
                              th:field="*{description}"
                              class="form-control"
                              rows="3"
                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                              placeholder="Mô tả tóm tắt về thể loại sách..."></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>

                <div class="mb-4 form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                    <label class="form-check-label fw-semibold" for="active">Kích hoạt thể loại</label>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/categories}" class="btn btn-outline-secondary">Hủy bỏ</a>
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-save me-1"></i> Lưu thông tin
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
