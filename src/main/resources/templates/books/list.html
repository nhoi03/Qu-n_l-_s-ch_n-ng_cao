<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản Lý Sách')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('books')}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container main-container">
    <div class="card mb-4">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="card-title mb-0"><i class="bi bi-journal-bookmark me-2"></i>Danh Sách Sách</h4>
                <a th:href="@{/books/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-1"></i>Thêm Sách Mới
                </a>
            </div>

            <!-- Filter form -->
            <form th:action="@{/books}" method="get" class="row g-2 mb-3">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo tên, tác giả, ISBN...">
                    </div>
                </div>
                <div class="col-md-3">
                    <select name="categoryId" class="form-select">
                        <option value="">-- Tất cả thể loại --</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"
                                th:selected="${categoryId != null and categoryId == cat.id}">
                        </option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select name="status" class="form-select">
                        <option value="">-- Trạng thái --</option>
                        <option th:each="st : ${statuses}"
                                th:value="${st}"
                                th:text="${st}"
                                th:selected="${status != null and status == st}">
                        </option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-secondary w-50"><i class="bi bi-funnel me-1"></i>Lọc</button>
                    <a th:href="@{/books}" class="btn btn-outline-secondary w-50">Đặt lại</a>
                </div>
            </form>

            <!-- Table -->
            <div class="table-responsive">
                <table class="table table-hover align-middle table-bordered">
                    <thead>
                        <tr>
                            <th style="width: 60px;">ID</th>
                            <th style="width: 140px;">ISBN</th>
                            <th>Tên Sách</th>
                            <th>Tác Giả</th>
                            <th>Thể Loại</th>
                            <th style="width: 100px;" class="text-center">Tổng SL</th>
                            <th style="width: 100px;" class="text-center">Sẵn Có</th>
                            <th style="width: 120px;" class="text-center">Trạng Thái</th>
                            <th style="width: 140px;" class="text-center">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(books)}">
                            <td colspan="9" class="text-center text-muted py-4">Không tìm thấy sách nào.</td>
                        </tr>
                        <tr th:each="book : ${books}">
                            <td class="fw-bold" th:text="${book.id}"></td>
                            <td><code class="text-dark" th:text="${book.isbn}"></code></td>
                            <td class="fw-semibold text-primary" th:text="${book.title}"></td>
                            <td th:text="${book.author}"></td>
                            <td>
                                <span class="badge bg-light text-dark border" th:text="${book.category.name}"></span>
                            </td>
                            <td class="text-center fw-bold" th:text="${book.totalQuantity}"></td>
                            <td class="text-center">
                                <span class="badge"
                                      th:classappend="${book.availableQuantity > 0 ? 'bg-success' : 'bg-danger'}"
                                      th:text="${book.availableQuantity}">
                                </span>
                            </td>
                            <td class="text-center">
                                <span th:if="${book.status.name() == 'ACTIVE'}" class="badge bg-success">ACTIVE</span>
                                <span th:if="${book.status.name() == 'INACTIVE'}" class="badge bg-warning text-dark">INACTIVE</span>
                                <span th:if="${book.status.name() == 'DELETED'}" class="badge bg-danger">DELETED</span>
                            </td>
                            <td class="text-center">
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/books/{id}/edit(id=${book.id})}" class="btn btn-outline-primary" title="Sửa">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:if="${book.status.name() != 'DELETED'}" th:action="@{/books/{id}/delete(id=${book.id})}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc chắn muốn xóa sách này?');">
                                        <button type="submit" class="btn btn-outline-danger" title="Xóa">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:replace="~{fragments/pagination :: pagination('/books', ${totalPages}, ${currentPage}, ${size})}"></div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
