<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Báo Cáo Phiếu Mượn Quá Hạn')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('reports')}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container main-container">
    <div class="card mb-4">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0 text-danger">
                <i class="bi bi-clock-history me-2"></i>Báo Cáo Danh Sách Phiếu Mượn Quá Hạn
            </h5>
            <a th:href="@{/reports}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Quay lại Tổng quan
            </a>
        </div>
        <div class="card-body">
            <p class="text-muted mb-3">
                Danh sách dưới đây liệt kê tất cả các phiếu mượn chưa được trả hết và đã quá ngày hẹn trả tính đến thời điểm hiện tại.
            </p>

            <div class="table-responsive">
                <table class="table table-hover align-middle table-bordered">
                    <thead class="table-danger">
                        <tr>
                            <th style="width: 70px;">Mã</th>
                            <th>Thành Viên</th>
                            <th>Email & SĐT</th>
                            <th style="width: 120px;">Ngày Mượn</th>
                            <th style="width: 120px;">Hạn Trả</th>
                            <th style="width: 140px;" class="text-center">Số Ngày Quá Hạn</th>
                            <th style="width: 130px;" class="text-center">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(overdueBorrowings)}">
                            <td colspan="7" class="text-center text-muted py-4">Hiện không có phiếu mượn nào bị quá hạn.</td>
                        </tr>
                        <tr th:each="b : ${overdueBorrowings}">
                            <td class="fw-bold" th:text="'#' + ${b.id}"></td>
                            <td class="fw-semibold text-primary" th:text="${b.member.fullName}"></td>
                            <td>
                                <div th:text="${b.member.email}"></div>
                                <small class="text-muted" th:text="${b.member.phone != null ? b.member.phone : ''}"></small>
                            </td>
                            <td th:text="${#temporals.format(b.borrowDate, 'dd/MM/yyyy')}"></td>
                            <td class="text-danger fw-bold" th:text="${#temporals.format(b.dueDate, 'dd/MM/yyyy')}"></td>
                            <td class="text-center">
                                <span class="badge bg-danger fs-6"
                                      th:text="${T(java.time.temporal.ChronoUnit).DAYS.between(b.dueDate, today)} + ' ngày'">
                                </span>
                            </td>
                            <td class="text-center">
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/borrowings/{id}(id=${b.id})}" class="btn btn-outline-primary" title="Xem chi tiết">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/borrowings/{id}/return(id=${b.id})}" class="btn btn-outline-danger" title="Xử lý trả sách">
                                        <i class="bi bi-arrow-return-left"></i> Trả sách
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:replace="~{fragments/pagination :: pagination('/reports/overdue', ${totalPages}, ${currentPage}, ${size})}"></div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
