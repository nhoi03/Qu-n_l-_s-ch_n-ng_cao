<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Top 5 Sách Mượn Nhiều Nhất')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('reports')}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container main-container" style="max-width: 900px;">
    <div class="card mb-4">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0 text-primary">
                <i class="bi bi-trophy-fill text-warning me-2"></i>Top 5 Cuốn Sách Được Mượn Nhiều Nhất
            </h5>
            <a th:href="@{/reports}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Quay lại Tổng quan
            </a>
        </div>
        <div class="card-body">
            <p class="text-muted mb-4">
                Bảng xếp hạng 5 cuốn sách có số lượng được mượn nhiều nhất trong toàn bộ hệ thống thư viện.
            </p>

            <div class="table-responsive">
                <table class="table table-hover align-middle table-bordered">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 80px;" class="text-center">Xếp Hạng</th>
                            <th style="width: 140px;">ISBN</th>
                            <th>Tên Sách</th>
                            <th>Tác Giả</th>
                            <th style="width: 150px;" class="text-center">Tổng Số Lượt Mượn</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(topBooks)}">
                            <td colspan="5" class="text-center text-muted py-4">Chưa có dữ liệu mượn sách.</td>
                        </tr>
                        <tr th:each="book, stat : ${topBooks}">
                            <td class="text-center">
                                <span class="badge rounded-circle p-2 fs-6"
                                      th:classappend="${stat.count == 1 ? 'bg-warning text-dark' : (stat.count == 2 ? 'bg-secondary' : (stat.count == 3 ? 'bg-danger' : 'bg-light text-dark border'))}"
                                      th:text="${stat.count}">
                                </span>
                            </td>
                            <td><code class="text-dark" th:text="${book.isbn}"></code></td>
                            <td class="fw-semibold text-primary fs-6" th:text="${book.title}"></td>
                            <td th:text="${book.author}"></td>
                            <td class="text-center fw-bold text-success fs-6">
                                <i class="bi bi-book me-1"></i>
                                <span th:text="${book.totalBorrowed} + ' cuốn'"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-4 text-center">
                <a th:href="@{/books}" class="btn btn-outline-primary">
                    <i class="bi bi-journal-bookmark me-1"></i> Xem toàn bộ kho sách
                </a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
